<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MoneyLedger — Collaborative Family & Event Finance Tracker</title>
    <meta name="description" content="Real-time synced finance tracker for couples, families, and individuals across Android, iPhone, and Desktop with event books, recurring EMI/insurance projections, offline mode, and JSON backups." />
    <meta property="og:title" content="MoneyLedger — Collaborative Family & Event Finance Tracker" />
    <meta property="og:description" content="Track shared event books, daily spends, monthly EMIs, half-yearly insurance, savings, and FDs in real time across devices." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0D9488" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MoneyLedger" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('moneyledger_theme') || localStorage.getItem('ledgersync_theme') || localStorage.getItem('nestledger_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8F9FA] text-slate-900 dark:bg-[#0B1120] dark:text-slate-100 antialiased selection:bg-teal-600/20 selection:text-teal-900 dark:selection:text-teal-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
